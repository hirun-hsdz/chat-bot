<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app" id="app">
        <aside class="side" id="side">
            <div class="brand"><span class="mark"></span><b>Chat Bot</b><button class="icon" id="collapse"
                    title="collapse sidebar"></button></div>

            <button class="primary" id="new-chat">+ New Chat</button>

            <input class="search" id="search" placeholder="Search conversations" aria-label="Search conversations">

            <div class="scroll">
                <h4>Favorites</h4>
                    <div id="favs"></div>
                <h4>Recent</h4>
                    <div id="recent"></div>
                <h4>Explore tools</h4>
                    <div id="tools" class="tools"></div>
                <h4>Insights</h4>
                    <div id="insights" class="insights"></div>
            </div>

            <div class="foot">
                <button class="row" id="openSetting">⚙️ Settings</button>

                <div class="profile"><span class="avater">You</span><>Guestworkspace<small id="modeTag"></small></span>
                </div>
            </div>

        </aside>
    </div>

</body>

</html>
