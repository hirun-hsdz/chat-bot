<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Bot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app" id="app">
        <aside class="side" id="side">
            <div class="brand"><span class="mark"></span><b>Chat Bot</b><button class="icon" id="collapse"
                    title="Collapse sidebar">«</button></div>
            <button class="primary" id="newChat">+ New chat</button>
            <input class="search" id="search" placeholder="Search conversations" aria- label="Search conversations">
            <div class="scroll">
                <h4>Favorites</h4>
                <div id="favs"></div>
                <h4>Recent</h4>
                <div id="recent"></div>
                <h4>Explore tools</h4>
                <div id="tools" class="tools"></div>
                <h4>Insights</h4>
                <div id="insights" class="insights"></div>
            </div>
            <div class="foot">
                <button class="row" id="openSettings">⚙ Settings</button>
                <div class="profile"><span class="avatar">You</span><span>Guest
                        workspace<small id="modeTag"></small></span></div>
            </div>
        </aside>
        <main class="main">
            <header class="top">
                <button class="icon" id="expand" title="Show sidebar">☰</button>
                <span id="title" class="ttl">New chat</span>
                <span class="spacer"></span>
                <select id="persona" aria-label="Personality mode"></select>
                <button class="icon" id="focus" title="Focus mode">◎</button>
                <button class="icon" id="theme" title="Toggle theme">◐</button>
                <button class="icon" id="export" title="Export as TXT">⇩</button>
                <button class="icon" id="clear" title="Clear conversation">⌫</button>
            </header>
            <div class="notice" id="notice">DEMO MODE: replies are simulated. Add an API
                endpoint in Settings to connect a real AI.</div>
            <section class="stream" id="stream" aria-live="polite"></section>
            <footer class="dock">
                <div class="chips" id="quick"></div>
                <div class="composer">
                    <button class="icon" id="attach" title="Attach a text file">⎘</button>
                    <input type="file" id="file" accept=".txt,.md,.js,.py,.html,.css,.json,.csv" hidden>
                    <textarea id="input" rows="1" maxlength="4000" placeholder="Message Chat Bot… (Enter to send, Shift+Enter for new line)"></textarea>
                    <button class="icon" id="clearInput" title="Clear input">✕</button>
                    <span class="count" id="count">0/4000</span>
                    <button class="send" id="send" title="Send">➤</button>
                </div>
                <small class="hint">Ctrl+K new chat · Ctrl+/ focus input · Esc stop</small>
            </footer>
        </main>
    </div>
